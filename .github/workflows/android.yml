name: Android build

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: superhero-showdown-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Publish every build of the game branch as the latest GitHub Release,
      # so the APK has a stable direct download link for phones:
      # https://github.com/Karthikrajt/Dhisgame/releases/latest/download/superhero-showdown.apk
      - name: Prepare release APK
        if: github.event_name == 'push' && github.ref_name == 'claude/project-thread-yz2xx8'
        run: cp build/app/outputs/flutter-apk/app-release.apk superhero-showdown.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref_name == 'claude/project-thread-yz2xx8'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Superhero Showdown build ${{ github.run_number }}
          body: |
            Test build of Superhero Showdown from commit ${{ github.sha }}.
            Download superhero-showdown.apk below and open it on an Android phone.
            Android may ask you to allow installing apps from this source.
          files: superhero-showdown.apk
          make_latest: true
